name: Apply first-peak threshold 0.20

on:
  push:
    branches:
      - agent/umbral-primer-pico-020

permissions:
  contents: write

jobs:
  patch-threshold:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/umbral-primer-pico-020
          fetch-depth: 0

      - name: Update threshold and validate Python
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          import re

          pattern = re.compile(r'(?m)^(\s*UMBRAL_PRIMER_PICO\s*=\s*)0\.70(\s*(?:#.*)?)$')
          modified = []
          constant_changes = 0

          for path in Path('.').rglob('*.py'):
              if '.git' in path.parts or '.venv' in path.parts or 'venv' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              updated, count = pattern.subn(r'\g<1>0.20\g<2>', text)
              if count:
                  constant_changes += count
                  updated = updated.replace('EMERREL > 0.70', 'EMERREL > 0.20')
                  updated = updated.replace('estrictamente superior a 0.70', 'estrictamente superior a 0.20')
                  updated = updated.replace('superior a 0.70', 'superior a 0.20')
                  path.write_text(updated, encoding='utf-8')
                  py_compile.compile(str(path), doraise=True)
                  modified.append(str(path))

          if constant_changes == 0:
              raise SystemExit('No se encontró UMBRAL_PRIMER_PICO = 0.70')

          print(f'Constantes modificadas: {constant_changes}')
          print('Archivos modificados:')
          for item in modified:
              print(f' - {item}')
          PY

      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply_umbral_primer_pico_020.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reduce umbral del primer pico a 0.20"
          git push origin agent/umbral-primer-pico-020
