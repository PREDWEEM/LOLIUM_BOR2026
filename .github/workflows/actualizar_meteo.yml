name: Actualizar SIGA y ECMWF ENS

on:
  schedule:
    # 07:30 y 15:30 hora Argentina (UTC-3)
    - cron: "30 10,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-meteo-bordenave
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas numpy xlrd openpyxl

      - name: Verificar archivos disponibles
        run: |
          echo "Directorio actual:"
          pwd
          echo "Contenido del repositorio:"
          ls -la
          echo "Contenido de data, si existe:"
          ls -la data || true

      - name: Actualizar observaciones SIGA y pronóstico ECMWF ENS
        env:
          # Descarga directa pública de SIGA–INTA para la estación Bordenave.
          # Esta URL reemplaza al uso manual de A872817.xls y permite
          # actualizar automáticamente el histórico observado.
          SIGA_DOWNLOAD_URL: "https://siga.inta.gob.ar/document/series/A872817.xls"
          SIGA_METHOD: GET

          # Respaldo local opcional si SIGA no responde.
          SIGA_LOCAL_FILE: A872817.xls

          # Variables opcionales si en el futuro SIGA exige parámetros o headers.
          SIGA_PARAMS_JSON: ${{ secrets.SIGA_PARAMS_JSON }}
          SIGA_POST_DATA_JSON: ${{ secrets.SIGA_POST_DATA_JSON }}
          SIGA_HEADERS_JSON: ${{ secrets.SIGA_HEADERS_JSON }}

          # Mantener en false para no mezclar pronósticos vencidos con observaciones.
          RELLENAR_HUECOS_CON_PRONOSTICO_VENCIDO: "false"
        run: python actualizar_meteo_bordenave.py

      - name: Guardar archivos actualizados
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p data/historico_pronosticos

          # Guardar temporalmente los archivos generados por esta corrida.
          TMPDIR_GENERADO="$(mktemp -d)"

          if [ -f meteo_daily.csv ]; then
            cp meteo_daily.csv "$TMPDIR_GENERADO/meteo_daily.csv"
          fi

          mkdir -p "$TMPDIR_GENERADO/data"
          mkdir -p "$TMPDIR_GENERADO/data/historico_pronosticos"

          if [ -f data/estado_actualizacion_meteo.json ]; then
            cp data/estado_actualizacion_meteo.json "$TMPDIR_GENERADO/data/estado_actualizacion_meteo.json"
          fi

          if [ -f data/siga_bordenave_observado.csv ]; then
            cp data/siga_bordenave_observado.csv "$TMPDIR_GENERADO/data/siga_bordenave_observado.csv"
          fi

          if [ -d data/historico_pronosticos ]; then
            cp -a data/historico_pronosticos/. "$TMPDIR_GENERADO/data/historico_pronosticos/" || true
          fi

          # Sincronizar con la última versión remota.
          # Esto evita conflictos de rebase en archivos generados automáticamente.
          git fetch origin main
          git reset --hard origin/main

          # Reaplicar los archivos generados por esta corrida.
          mkdir -p data/historico_pronosticos

          if [ -f "$TMPDIR_GENERADO/meteo_daily.csv" ]; then
            cp "$TMPDIR_GENERADO/meteo_daily.csv" meteo_daily.csv
          fi

          if [ -f "$TMPDIR_GENERADO/data/estado_actualizacion_meteo.json" ]; then
            cp "$TMPDIR_GENERADO/data/estado_actualizacion_meteo.json" data/estado_actualizacion_meteo.json
          fi

          if [ -f "$TMPDIR_GENERADO/data/siga_bordenave_observado.csv" ]; then
            cp "$TMPDIR_GENERADO/data/siga_bordenave_observado.csv" data/siga_bordenave_observado.csv
          fi

          if [ -d "$TMPDIR_GENERADO/data/historico_pronosticos" ]; then
            cp -a "$TMPDIR_GENERADO/data/historico_pronosticos/." data/historico_pronosticos/ || true
          fi

          git add -A meteo_daily.csv data/

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
            exit 0
          fi

          git commit -m "Actualiza SIGA y ECMWF ENS"
          git push origin HEAD:main
